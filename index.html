<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIG Automation Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
/* ============================================================
   1) PASTE YOUR FIREBASE SETTINGS IN THE SCRIPT AT THE BOTTOM
      (search for FIREBASE_CONFIG). Until then the page runs in
      "preview mode" with sample notes that are not saved.
   ============================================================ */
:root {
  --navy: #0B1736;
  --navy-2: #13265A;
  --board: #F3F1EC;
  --dot: #D9D4C8;
  --ink: #1D2433;
  --ink-2: #545C6E;
  --yellow: #FFE58A; --yellow-d: #E9C443;
  --pink: #FFC2D4;   --pink-d: #F08DAC;
  --blue: #BFE1FF;   --blue-d: #6FB4F0;
  --green: #C6F0C9;  --green-d: #6CCB78;
  --sign: #FFC23A;
  --cobalt: #2F5BEA;
  --font: 'Inter', 'Segoe UI', system-ui, sans-serif;
  --hand: 'Caveat', 'Segoe Print', cursive;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--board); color: var(--ink); font-family: var(--font); }
body {
  min-height: 100vh;
  background-color: var(--board);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
  background-size: 22px 22px;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }

/* ---------- top bar ---------- */
header {
  position: sticky; top: 0; z-index: 10; background: var(--navy); color: #FFFFFF;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 12px max(18px, env(safe-area-inset-left, 0px));
  box-shadow: 0 6px 20px rgba(11,23,54,.18);
}
.bar { max-width: 1500px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 240px; }
.brand img { width: 62px; height: auto; }
.brand .t { display: flex; flex-direction: column; gap: 4px; }
.tag { align-self: flex-start; background: var(--sign); color: var(--navy); font-size: 11px; font-weight: 800; letter-spacing: 2.5px; padding: 4px 9px; border-radius: 4px; }
.brand h1 { margin: 0; font-size: clamp(20px, 2.6vw, 28px); font-weight: 800; letter-spacing: -.3px; }
.stats { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.count { display: flex; align-items: baseline; gap: 6px; background: var(--navy-2); border-radius: 12px; padding: 8px 14px; }
.count b { font-size: 24px; font-weight: 800; color: var(--sign); font-variant-numeric: tabular-nums; }
.count span { font-size: 13px; color: #C9D4EE; font-weight: 600; }
.me { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; background: transparent; border: 1px solid #34488A; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 13.5px; font-weight: 600; color: #FFFFFF; }
.me:hover { border-color: #C9D4EE; }
.me small { color: #C9D4EE; font-size: 12px; }

/* ---------- toolbar ---------- */
.tools { max-width: 1500px; margin: 18px auto 0; padding: 0 max(18px, env(safe-area-inset-right, 0px)) 0 max(18px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tools p { margin: 0; flex: 1; min-width: 220px; color: var(--ink-2); font-size: 15px; }
.tools p strong { color: var(--ink); }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 0; cursor: pointer; font-weight: 700; font-size: 15px; transition: transform .15s ease, box-shadow .15s ease; }
.btn:active { transform: scale(.97); }
.btn.add { background: var(--sign); color: var(--navy); box-shadow: 0 4px 0 #C99212; }
.btn.add:hover { transform: translateY(-1px); }
.seg { display: inline-flex; background: #FFFFFF; border: 1px solid #DCD6CA; border-radius: 12px; padding: 4px; }
.seg button { min-height: 38px; padding: 6px 14px; border-radius: 9px; border: 0; background: transparent; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--navy); color: #FFFFFF; }

.banner { max-width: 1500px; margin: 14px auto 0; padding: 0 max(18px, env(safe-area-inset-right, 0px)) 0 max(18px, env(safe-area-inset-left, 0px)); }
.banner div { background: #FFF4D6; border: 1px solid #F0D58A; color: #6A4A00; border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.banner.err div { background: #FFE5EA; border-color: #F3A9B8; color: #8A1830; }

/* ---------- board ---------- */
main { max-width: 1500px; margin: 0 auto; padding: 22px max(18px, env(safe-area-inset-right, 0px)) 60px max(18px, env(safe-area-inset-left, 0px)); }
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px 26px; align-items: start; }
.empty { text-align: center; padding: 80px 20px; color: var(--ink-2); font-size: 17px; }
.empty b { display: block; font-family: var(--hand); font-size: 38px; color: var(--ink); margin-bottom: 6px; }

.note {
  --c: var(--yellow); --cd: var(--yellow-d);
  position: relative; background: var(--c); border-radius: 4px 4px 18px 4px;
  padding: 26px 20px 16px; min-height: 250px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 10px 22px -10px rgba(30,30,50,.35), 0 2px 6px rgba(30,30,50,.08);
  transform: rotate(var(--r, 0deg)); transition: transform .2s ease, box-shadow .2s ease;
}
.note:hover { transform: rotate(0deg) translateY(-3px); box-shadow: 0 16px 30px -12px rgba(30,30,50,.4), 0 2px 6px rgba(30,30,50,.08); z-index: 2; }
.note.pink { --c: var(--pink); --cd: var(--pink-d); }
.note.blue { --c: var(--blue); --cd: var(--blue-d); }
.note.green { --c: var(--green); --cd: var(--green-d); }
.note::before { /* tape */
  content: ""; position: absolute; top: -11px; left: 50%; width: 86px; height: 24px; transform: translateX(-50%) rotate(-3deg);
  background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.7); box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.note.pop { animation: pop .45s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.7) rotate(-8deg); } to { opacity: 1; transform: rotate(var(--r, 0deg)); } }
.field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.field em { font-style: normal; font-size: 10.5px; font-weight: 800; letter-spacing: 1.8px; color: rgba(29,36,51,.62); }
.field span { font-size: 15px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.field.task span { font-family: var(--hand); font-size: 25px; font-weight: 700; line-height: 1.1; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.note .foot { margin-top: auto; padding-top: 10px; border-top: 1.5px dashed rgba(29,36,51,.22); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.vote { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--ink); background: rgba(255,255,255,.55); cursor: pointer; font-weight: 700; font-size: 14px; transition: transform .12s ease, background .15s ease; }
.vote:hover { background: #FFFFFF; }
.vote[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; }
.vote.bump { animation: bump .35s ease; }
@keyframes bump { 40% { transform: scale(1.15); } }
.votes { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 4px; border: 0; background: none; cursor: pointer; font-weight: 700; font-size: 14px; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 4px; }
.votes[disabled] { cursor: default; text-decoration: none; color: var(--ink-2); font-weight: 600; }
.del { margin-left: auto; width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; color: rgba(29,36,51,.55); display: grid; place-items: center; }
.del:hover { background: rgba(255,255,255,.6); color: #A3102E; }
.breakdown { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s ease; }
.breakdown.open { grid-template-rows: 1fr; }
.breakdown > div { overflow: hidden; }
.breakdown ul { list-style: none; margin: 8px 0 0; padding: 10px 12px; background: rgba(255,255,255,.6); border-radius: 10px; display: flex; flex-direction: column; gap: 6px; }
.breakdown li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 13px; align-items: center; }
.breakdown li .b { grid-column: 1 / -1; height: 5px; border-radius: 4px; background: rgba(29,36,51,.12); overflow: hidden; }
.breakdown li .b i { display: block; height: 100%; background: var(--ink); border-radius: 4px; }
.breakdown li b { font-variant-numeric: tabular-nums; }
.mine { position: absolute; top: 10px; right: 12px; font-size: 10.5px; font-weight: 800; letter-spacing: 1.5px; color: rgba(29,36,51,.55); }

/* ---------- dialogs ---------- */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(11,23,54,.55); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 18px; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: min(640px, 100%); max-height: calc(100vh - 36px); overflow: auto; background: #FFFFFF; border-radius: 20px; padding: 26px; box-shadow: 0 30px 60px rgba(0,0,0,.3); animation: rise .3s cubic-bezier(.2,1,.3,1); display: flex; flex-direction: column; gap: 16px; }
@keyframes rise { from { opacity: 0; transform: translateY(20px) scale(.98); } }
.sheet h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.3px; }
.sheet p { margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.5; }
.depts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.dchip { min-height: 46px; padding: 8px 12px; border-radius: 12px; border: 1.5px solid #DCD6CA; background: #FFFFFF; cursor: pointer; font-weight: 600; font-size: 14px; text-align: left; }
.dchip:hover { border-color: var(--navy); }
.dchip[aria-pressed="true"] { background: var(--navy); color: #FFFFFF; border-color: var(--navy); }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
label.f input { min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #DCD6CA; font-size: 16px; font-weight: 500; color: var(--ink); background: #FFFFFF; }
label.f input:focus { border-color: var(--cobalt); outline: none; }
label.f small { font-weight: 500; color: #7A8090; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.colors { display: flex; gap: 10px; align-items: center; }
.colors span { font-size: 13px; font-weight: 700; color: var(--ink-2); margin-right: 4px; }
.sw { width: 40px; height: 40px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; }
.sw[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px #FFFFFF inset; }
.preview { align-self: center; width: 100%; }
.actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.btn.ghost { background: transparent; border: 1.5px solid #DCD6CA; }
.btn.primary { background: var(--navy); color: #FFFFFF; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.err-msg { color: #A3102E; font-size: 14px; font-weight: 600; min-height: 18px; }
.confirm-del { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: rgba(255,255,255,.75); border-radius: 10px; font-size: 13.5px; font-weight: 600; width: 100%; }
.confirm-del div { display: flex; gap: 8px; }
.confirm-del button { min-height: 34px; padding: 4px 12px; border-radius: 8px; border: 1.5px solid var(--ink); background: #FFFFFF; cursor: pointer; font-weight: 700; font-size: 13px; }
.confirm-del button.yes { background: #A3102E; border-color: #A3102E; color: #FFFFFF; }

.toast { position: fixed; z-index: 40; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: #FFFFFF; padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: rise .25s ease; max-width: calc(100vw - 32px); }

@media (max-width: 560px) {
  .wall { grid-template-columns: minmax(0, 1fr); gap: 26px; }
  .row2, .pair { grid-template-columns: minmax(0, 1fr); }
  .note { --r: 0deg !important; }
  .brand img { width: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<script>
/* ============================================================
   FIREBASE_CONFIG: paste the values from
   Firebase console > Project settings > Your apps > Web app.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBggQfFHJpygFmvv18ATkVmq_LAvvQyDac",
  authDomain: "aig-automation-wall.firebaseapp.com",
  projectId: "aig-automation-wall",
  storageBucket: "aig-automation-wall.firebasestorage.app",
  messagingSenderId: "1010528877817",
  appId: "1:1010528877817:web:ea8d21167ea7a704f27628"
};

/* Departments people can pick from. Edit freely; "Other" lets people type their own. */
const DEPARTMENTS = ["Airport Operations", "Commercial, Route & Real Estate Development", "Corporate Finance",
  "CSR, Marketing & Communication", "Engineering & Maintenance", "Executive", "Finance",
  "Government Entities Relations and Administration", "Human Resources", "Information Technology",
  "Legal, Compliance and Ethics", "Operations", "PMO", "Quality, OHS and Sustainability", "Security",
  "Strategy and Special Projects", "Supply Chain Management", "Technical Division"];

const COLORS = ["yellow", "pink", "blue", "green"];
const LIMITS = { task: 160, often: 40, lost: 40, dept: 60 };
const $ = id => document.getElementById(id);
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let notes = [];          // {id, dept, task, often, lost, color, uid, t}
let votes = [];          // {id, noteId, uid, dept}
let uid = null, dept = null, sort = "new", openBreakdown = new Set(), askDelete = null;
let api = null;          // backend: add(note), vote(noteId), unvote(noteId), remove(noteId)
const seen = new Set();

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function banner(msg, err) { $("banner").hidden = !msg; $("banner").className = "banner" + (err ? " err" : ""); $("bannerText").textContent = msg || ""; }
function tilt(id) { let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) | 0; return ((Math.abs(h) % 7) - 3) * 0.6; }
function plural(n, one, many) { return n === 1 ? one : many; }

/* ---------------- render ---------------- */
function render() {
  const byNote = {}, live = new Set(notes.map(n => n.id));
  const liveVotes = votes.filter(v => live.has(v.noteId));
  liveVotes.forEach(v => { (byNote[v.noteId] = byNote[v.noteId] || []).push(v); });
  const list = notes.slice();
  if (sort === "top") list.sort((a, b) => ((byNote[b.id] || []).length - (byNote[a.id] || []).length) || (b.t - a.t));
  else list.sort((a, b) => b.t - a.t);

  const wall = $("wall");
  const before = new Map();
  if (!reduce) wall.querySelectorAll(".note").forEach(el => before.set(el.dataset.id, el.getBoundingClientRect()));
  wall.textContent = "";

  list.forEach(n => {
    const vs = byNote[n.id] || [], mineVote = vs.some(v => v.uid === uid);
    const el = document.createElement("article");
    el.className = "note " + (COLORS.includes(n.color) ? n.color : "yellow");
    el.dataset.id = n.id;
    el.style.setProperty("--r", tilt(n.id) + "deg");
    if (!seen.has(n.id)) { if (seen.size && !reduce) el.classList.add("pop"); seen.add(n.id); }

    const f = (label, value, cls) => {
      const d = document.createElement("div"); d.className = "field" + (cls ? " " + cls : "");
      const e = document.createElement("em"); e.textContent = label;
      const s = document.createElement("span"); s.textContent = value || "–";
      d.append(e, s); return d;
    };
    if (n.uid === uid) { const m = document.createElement("span"); m.className = "mine"; m.textContent = "YOUR NOTE"; el.appendChild(m); }
    el.appendChild(f("DEPARTMENT", n.dept));
    el.appendChild(f("TASK", n.task, "task"));
    const pair = document.createElement("div"); pair.className = "pair";
    pair.append(f("HOW OFTEN", n.often), f("TIME LOST", n.lost));
    el.appendChild(pair);

    const foot = document.createElement("div"); foot.className = "foot";
    if (askDelete === n.id) {
      const c = document.createElement("div"); c.className = "confirm-del";
      c.innerHTML = '<span>Delete this note and its votes for everyone?</span><div><button type="button" class="yes">Delete</button><button type="button" class="no">Keep</button></div>';
      c.querySelector(".yes").addEventListener("click", () => { askDelete = null; api.remove(n.id).then(() => toast("Note deleted")).catch(fail); });
      c.querySelector(".no").addEventListener("click", () => { askDelete = null; render(); });
      foot.appendChild(c);
    } else {
      const vb = document.createElement("button"); vb.type = "button"; vb.className = "vote";
      vb.setAttribute("aria-pressed", String(mineVote));
      vb.textContent = mineVote ? "👍 Voted" : "👍 Vote";
      vb.title = mineVote ? "Tap to take your vote back" : "Vote to automate this";
      vb.addEventListener("click", () => {
        if (!dept) { askDept(); return; }
        vb.classList.remove("bump"); void vb.offsetWidth; vb.classList.add("bump");
        (mineVote ? api.unvote(n.id) : api.vote(n.id)).catch(fail);
      });
      const cb = document.createElement("button"); cb.type = "button"; cb.className = "votes";
      cb.textContent = vs.length + " " + plural(vs.length, "vote", "votes");
      if (!vs.length) cb.disabled = true;
      cb.setAttribute("aria-expanded", String(openBreakdown.has(n.id)));
      cb.addEventListener("click", () => { openBreakdown.has(n.id) ? openBreakdown.delete(n.id) : openBreakdown.add(n.id); render(); });
      foot.append(vb, cb);
      if (n.uid === uid) {
        const db = document.createElement("button"); db.type = "button"; db.className = "del"; db.setAttribute("aria-label", "Delete your note");
        db.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>';
        db.addEventListener("click", () => { askDelete = n.id; render(); });
        foot.appendChild(db);
      }
    }
    el.appendChild(foot);

    if (vs.length) {
      const counts = {};
      vs.forEach(v => { counts[v.dept || "Unknown"] = (counts[v.dept || "Unknown"] || 0) + 1; });
      const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      const max = rows[0][1];
      const bd = document.createElement("div"); bd.className = "breakdown" + (openBreakdown.has(n.id) ? " open" : "");
      const inner = document.createElement("div"); const ul = document.createElement("ul");
      rows.forEach(([d, c]) => {
        const li = document.createElement("li");
        const s = document.createElement("span"); s.textContent = d;
        const b = document.createElement("b"); b.textContent = c;
        const bar = document.createElement("span"); bar.className = "b"; bar.innerHTML = '<i style="width:' + (c / max * 100) + '%"></i>';
        li.append(s, b, bar); ul.appendChild(li);
      });
      inner.appendChild(ul); bd.appendChild(inner); el.appendChild(bd);
    }
    wall.appendChild(el);
  });

  // smooth re-ordering
  if (!reduce && before.size) {
    wall.querySelectorAll(".note").forEach(el => {
      const a = before.get(el.dataset.id); if (!a) return;
      const b = el.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
      if (!dx && !dy) return;
      el.animate([{ transform: "translate(" + dx + "px," + dy + "px) rotate(var(--r))" }, { transform: "translate(0,0) rotate(var(--r))" }], { duration: 420, easing: "cubic-bezier(.2,.8,.2,1)" });
    });
  }

  $("empty").hidden = notes.length > 0;
  $("ideaCount").textContent = notes.length; $("ideaWord").textContent = plural(notes.length, "idea", "ideas");
  $("voteCount").textContent = liveVotes.length; $("voteWord").textContent = plural(liveVotes.length, "vote", "votes");
}
function fail(e) {
  console.error(e);
  const c = e && e.code || "";
  if (c === "timeout") { banner("The database didn't answer. Check that Firestore Database was created in Firebase and that projectId in FIREBASE_CONFIG is correct, then reload.", true); toast("Not saved: the database didn't answer."); }
  else if (c === "permission-denied") { banner("The database refused the save. Paste the latest firestore-rules.txt into Firestore > Rules, click Publish, then reload.", true); toast("Not saved: blocked by the database rules."); }
  else if (!uid) { banner("Not signed in to the database yet. Turn on Anonymous sign-in in Firebase Authentication, then reload.", true); toast("Not saved: not connected yet."); }
  else toast("That didn't save (" + (c || "error") + "). Try again.");
}
function readErr(e, what) {
  const c = e && e.code || "";
  if (c === "permission-denied") return "Can't read " + what + ": paste firestore-rules.txt into Firestore > Rules and click Publish, then reload.";
  if (c === "not-found" || c === "failed-precondition") return "Can't find the database. Create it in Firebase: Build > Firestore Database > Create database, then reload.";
  return "Can't read " + what + " (" + (c || "error") + "). Check FIREBASE_CONFIG and your connection, then reload.";
}

/* ---------------- sort ---------------- */
function setSort(s) { sort = s; $("sortNew").setAttribute("aria-pressed", String(s === "new")); $("sortTop").setAttribute("aria-pressed", String(s === "top")); render(); }
$("sortNew").addEventListener("click", () => setSort("new"));
$("sortTop").addEventListener("click", () => setSort("top"));

/* ---------------- department picker ---------------- */
function close() { $("layer").textContent = ""; }
function askDept(first) {
  const L = $("layer");
  L.innerHTML = '<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dTitle">' +
    '<h2 id="dTitle">Which department are you from?</h2>' +
    '<p>Your department goes on the notes you post and counts with your votes. You can change it later.</p>' +
    '<div class="depts" id="deptGrid"></div>' +
    '<label class="f" for="otherDept">Not listed? Type it here<input id="otherDept" type="text" maxlength="' + LIMITS.dept + '" placeholder="e.g. Cargo"></label>' +
    '<div class="err-msg" id="dErr"></div>' +
    '<div class="actions">' + (first ? '' : '<button type="button" class="btn ghost" id="dCancel">Cancel</button>') +
    '<button type="button" class="btn primary" id="dGo">Enter the wall</button></div></div></div>';
  let pick = DEPARTMENTS.includes(dept) ? dept : null;
  const grid = $("deptGrid");
  DEPARTMENTS.forEach(d => {
    const b = document.createElement("button"); b.type = "button"; b.className = "dchip"; b.textContent = d;
    b.setAttribute("aria-pressed", String(d === pick));
    b.addEventListener("click", () => { pick = d; $("otherDept").value = ""; grid.querySelectorAll(".dchip").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
    grid.appendChild(b);
  });
  if (dept && !DEPARTMENTS.includes(dept)) $("otherDept").value = dept;
  $("otherDept").addEventListener("input", () => { if ($("otherDept").value.trim()) { pick = null; grid.querySelectorAll(".dchip").forEach(x => x.setAttribute("aria-pressed", "false")); } });
  $("dGo").addEventListener("click", () => {
    const typed = $("otherDept").value.trim().replace(/\s+/g, " ");
    const d = typed || pick;
    if (!d) { $("dErr").textContent = "Pick your department or type it in."; return; }
    dept = d; store("aig-wall-dept", d);
    $("meDept").textContent = d; $("meBtn").hidden = false;
    close();
  });
  if (!first) $("dCancel").addEventListener("click", close);
}
$("meBtn").addEventListener("click", () => askDept(false));

/* ---------------- add note ---------------- */
function addNote() {
  if (!dept) { askDept(true); return; }
  let color = COLORS[Math.floor(Math.random() * COLORS.length)];
  $("layer").innerHTML = '<div class="scrim"><form class="sheet" role="dialog" aria-modal="true" aria-labelledby="aTitle" id="addForm" novalidate>' +
    '<h2 id="aTitle">Add a sticky note</h2>' +
    '<label class="f" for="fDept">Department<input id="fDept" type="text" maxlength="' + LIMITS.dept + '"></label>' +
    '<label class="f" for="fTask">Task <small>What do you do again and again?</small><input id="fTask" type="text" maxlength="' + LIMITS.task + '" placeholder="Copying delay figures from 3 emails into the weekly report" required></label>' +
    '<div class="row2"><label class="f" for="fOften">How often<input id="fOften" type="text" maxlength="' + LIMITS.often + '" placeholder="Every Monday"></label>' +
    '<label class="f" for="fLost">Time lost<input id="fLost" type="text" maxlength="' + LIMITS.lost + '" placeholder="2 hours each time"></label></div>' +
    '<div class="colors" role="group" aria-label="Note colour"><span>Colour</span></div>' +
    '<div class="err-msg" id="aErr"></div>' +
    '<div class="actions"><button type="button" class="btn ghost" id="aCancel">Cancel</button><button type="submit" class="btn primary" id="aGo">Stick it on the wall</button></div>' +
    '</form></div>';
  $("fDept").value = dept;
  const cg = document.querySelector(".colors");
  COLORS.forEach(c => {
    const b = document.createElement("button"); b.type = "button"; b.className = "sw"; b.style.background = "var(--" + c + ")";
    b.setAttribute("aria-label", c); b.setAttribute("aria-pressed", String(c === color));
    b.addEventListener("click", () => { color = c; cg.querySelectorAll(".sw").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
    cg.appendChild(b);
  });
  $("fTask").focus();
  $("aCancel").addEventListener("click", close);
  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const clean = v => v.trim().replace(/\s+/g, " ");
    const n = { dept: clean($("fDept").value) || dept, task: clean($("fTask").value), often: clean($("fOften").value), lost: clean($("fLost").value), color };
    if (!n.task) { $("aErr").textContent = "Describe the task first."; $("fTask").focus(); return; }
    if (!n.often || !n.lost) { $("aErr").textContent = "Add how often it happens and the time it costs."; return; }
    if (!uid) { $("aErr").textContent = "Still connecting to the wall. Wait a few seconds and try again, or check the message at the top of the page."; return; }
    $("aGo").disabled = true; $("aGo").textContent = "Sticking…";
    api.add(n).then(() => { close(); setSort("new"); toast("Your note is on the wall"); window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); })
      .catch(err => { fail(err); $("aGo").disabled = false; $("aGo").textContent = "Stick it on the wall"; });
  });
}
$("addBtn").addEventListener("click", addNote);
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("layer").firstChild && dept) close(); });

/* ---------------- backends ---------------- */
function previewBackend() {
  banner("Preview mode: Firebase settings are not added yet, so these are sample notes and nothing is saved or shared.", false);
  uid = "me";
  const now = Date.now();
  notes = [
    { id: "s1", dept: "Operations", task: "Copying delay figures from 3 emails into the weekly report", often: "Every Monday", lost: "2 hours each time", color: "yellow", uid: "x", t: now - 50000 },
    { id: "s2", dept: "Finance", task: "Matching supplier invoices to purchase orders by hand", often: "Daily", lost: "45 minutes a day", color: "pink", uid: "x", t: now - 40000 },
    { id: "s3", dept: "Human Resources", task: "Answering the same leave-policy questions by email", often: "Several times a day", lost: "1 hour a day", color: "blue", uid: "x", t: now - 30000 },
    { id: "s4", dept: "Airport Operations", task: "Writing complaint replies from scratch", often: "About 20 a week", lost: "15 minutes each", color: "green", uid: "x", t: now - 20000 }
  ];
  votes = [["s1","Operations"],["s1","Operations"],["s1","Operations"],["s1","Finance"],["s1","Finance"],["s1","Human Resources"],["s1","Human Resources"],["s1","Information Technology"],["s3","Human Resources"],["s3","Information Technology"],["s2","Finance"],["s2","Supply Chain Management"],["s2","Finance"]]
    .map(([noteId, d], i) => ({ id: "v" + i, noteId, uid: "u" + i, dept: d }));
  notes.forEach(n => seen.add(n.id));
  api = {
    add: n => { const id = "p" + Date.now(); notes.push(Object.assign({ id, uid, t: Date.now() }, n)); render(); return Promise.resolve(); },
    vote: id => { votes.push({ id: id + "_" + uid, noteId: id, uid, dept }); render(); return Promise.resolve(); },
    unvote: id => { votes = votes.filter(v => !(v.noteId === id && v.uid === uid)); render(); return Promise.resolve(); },
    remove: id => { notes = notes.filter(n => n.id !== id); votes = votes.filter(v => v.noteId !== id); render(); return Promise.resolve(); }
  };
  render();
}

function firebaseBackend() {
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs = firebase.firestore();
  try { fs.settings({ experimentalForceLongPolling: true }); } catch (e) {}
  banner("Connecting to the wall…", false);
  const slow = setTimeout(() => banner("Still can't reach the database after 12 seconds. Check: (1) Firestore Database was created in Firebase (Build > Firestore Database), (2) projectId in FIREBASE_CONFIG matches your project exactly, (3) your network doesn't block firestore.googleapis.com. Then reload.", true), 12000);
  firebase.auth().signInAnonymously().catch(e => {
    console.error(e); clearTimeout(slow);
    const c = e && e.code || "";
    banner(c.includes("admin-restricted") || c.includes("operation-not-allowed")
      ? "Anonymous sign-in is off. In Firebase: Build > Authentication > Sign-in method > Anonymous > Enable, then reload."
      : c.includes("api-key") ? "The apiKey in FIREBASE_CONFIG is wrong. Copy it again from Project settings, then reload."
      : "Could not sign in (" + c + "). Check FIREBASE_CONFIG and that Anonymous sign-in is enabled, then reload.", true);
  });
  firebase.auth().onAuthStateChanged(user => {
    if (!user) return;
    uid = user.uid;
    let gotNotes = false, gotVotes = false;
    const done = () => { if (gotNotes && gotVotes) { clearTimeout(slow); banner(""); } };
    fs.collection("notes").onSnapshot(snap => {
      notes = snap.docs.map(d => {
        const x = d.data(), ts = x.createdAt && x.createdAt.toMillis ? x.createdAt.toMillis() : Date.now();
        return { id: d.id, dept: String(x.dept || ""), task: String(x.task || ""), often: String(x.often || ""), lost: String(x.lost || ""), color: x.color, uid: x.uid, t: ts };
      });
      if (!gotNotes) notes.forEach(n => seen.add(n.id));
      gotNotes = true; done(); render();
    }, e => { console.error(e); clearTimeout(slow); banner(readErr(e, "the wall"), true); });
    fs.collection("votes").onSnapshot(snap => {
      votes = snap.docs.map(d => { const x = d.data(); return { id: d.id, noteId: x.noteId, uid: x.uid, dept: String(x.dept || "") }; });
      gotVotes = true; done(); render();
    }, e => { console.error(e); clearTimeout(slow); banner(readErr(e, "the votes"), true); });
  });
  const timed = p => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), 12000))]);
  api = {
    add: n => timed(fs.collection("notes").add({ dept: n.dept.slice(0, LIMITS.dept), task: n.task.slice(0, LIMITS.task), often: n.often.slice(0, LIMITS.often), lost: n.lost.slice(0, LIMITS.lost), color: n.color, uid, createdAt: firebase.firestore.FieldValue.serverTimestamp() })),
    vote: id => timed(fs.collection("votes").doc(id + "_" + uid).set({ noteId: id, uid, dept: dept.slice(0, LIMITS.dept), createdAt: firebase.firestore.FieldValue.serverTimestamp() })),
    unvote: id => timed(fs.collection("votes").doc(id + "_" + uid).delete()),
    remove: id => timed(fs.collection("notes").doc(id).delete())
  };
}

/* ---------------- start ---------------- */
dept = store("aig-wall-dept");
if (dept) { $("meDept").textContent = dept; $("meBtn").hidden = false; }
const configured = FIREBASE_CONFIG.projectId && FIREBASE_CONFIG.projectId !== "PASTE_HERE";
if (configured && window.firebase) firebaseBackend(); else previewBackend();
if (!dept) askDept(true);
</script>
